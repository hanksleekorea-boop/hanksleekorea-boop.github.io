<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>LinkMax — Review your implementation plan</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#5f6d82;--line:#d8e0ec;--brand:#1769d2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:28px}header,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}h1{font-size:clamp(30px,5vw,48px);margin:.2em 0}.lead,#status{color:var(--muted)}#sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.section{border:1px solid var(--line);border-radius:12px;padding:14px;overflow-wrap:anywhere}.section h3{margin:0 0 8px}.section pre{white-space:pre-wrap;font:13px/1.5 ui-monospace,monospace}button{min-height:48px;border:0;border-radius:10px;background:var(--brand);color:#fff;padding:0 18px;font-weight:800}button:disabled{opacity:.5}@media(max-width:680px){main{padding:14px}#sections{grid-template-columns:1fr}header,.panel{padding:17px}}</style></head><body><main><header><b>🔗 LinkMax</b><h1>Review your implementation plan</h1><p class="lead">Review the current evidence and limitations before accepting this exact plan revision.</p></header><section class="panel"><p id="status" role="status" aria-live="polite">Loading the plan.</p><div id="sections" aria-label="Plan details"></div><button id="accept" type="button" disabled>Accept this plan revision</button></section></main><script type="module">
const message={"title":"Review your implementation plan","lead":"Review the current evidence and limitations before accepting this exact plan revision.","loading":"Loading the plan.","failed":"We could not load this plan. Check the link and connection.","accept":"Accept this plan revision","accepted":"This plan revision has been accepted.","waiting":"A LinkMax operator must review this revision first.","sections":"Plan details"},params=new URLSearchParams(location.search),projectId=params.get('project'),planId=params.get('plan'),status=document.querySelector('#status'),button=document.querySelector('#accept'),sections=document.querySelector('#sections');let plan,csrfToken='';
const render=data=>{sections.replaceChildren(...data.sections.map(section=>{const card=document.createElement('article');card.className='section';const heading=document.createElement('h3');heading.textContent=section.id.replaceAll('_',' ');const body=document.createElement('pre');body.textContent=JSON.stringify(section.data,null,2);card.append(heading,body);return card;}));};
async function load(){try{if(!projectId||!planId)throw new Error('missing');const session=await fetch('/v1/fit-link/projects/'+encodeURIComponent(projectId)+'/session',{credentials:'include'});if(!session.ok)throw new Error(String(session.status));csrfToken=String((await session.json()).csrfToken??'');const response=await fetch('/v1/fit-link/projects/'+encodeURIComponent(projectId)+'/plans/'+encodeURIComponent(planId),{credentials:'include',headers:{accept:'application/json'}});if(!response.ok)throw new Error(String(response.status));plan=await response.json();render(plan.result??plan);const operatorReviewed=plan.readiness?.operator?.decision==='approve';status.textContent=operatorReviewed?message.lead:message.waiting;button.disabled=!operatorReviewed||!csrfToken;}catch{status.textContent=message.failed;}}
button.addEventListener('click',async()=>{button.disabled=true;try{const headers={'content-type':'application/json','x-csrf-token':csrfToken};const response=await fetch('/v1/fit-link/projects/'+encodeURIComponent(projectId)+'/plans/'+encodeURIComponent(planId)+'/review',{method:'POST',credentials:'include',headers,body:JSON.stringify({decision:'accept'})});if(!response.ok)throw new Error(String(response.status));const accepted=await response.json();status.textContent=accepted?message.accepted:message.failed;}catch{status.textContent=message.failed;button.disabled=false;}});load();
</script></body></html>
