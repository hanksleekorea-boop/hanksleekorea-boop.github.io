<!DOCTYPE html>
<html lang="ko"><head><meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"><meta name="referrer" content="strict-origin-when-cross-origin"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinkMax 모바일 작업대</title><style>:root{--bg:#f5f7fb;--card:#fff;--tx:#172033;--muted:#5f6c84;--line:#d9e0ec;--brand:#2864dc;--good:#08783e;--warn:#9a6500;--bad:#ba2431}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,sans-serif}a{color:var(--brand)}button,input,select{font:inherit}.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}.side{background:#10172a;color:#fff;padding:22px 14px}.logo{font-size:20px;font-weight:800;margin:0 8px 22px}.nav{display:grid;gap:5px}.nav a{color:#ccd5eb;text-decoration:none;padding:9px 11px;border-radius:8px}.nav a[aria-current=page]{background:#2864dc;color:#fff}.main{padding:24px;min-width:0}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.head h1{margin:0;font-size:24px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;min-width:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.filters{display:grid;grid-template-columns:repeat(6,minmax(105px,1fr));gap:8px;align-items:end}.field{display:grid;gap:4px;min-width:0}.field input,.field select{min-width:0;width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--tx)}button,.action{border:0;border-radius:8px;background:var(--brand);color:#fff;padding:9px 13px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#edf2fd;color:#174ba9}.table-wrap{overflow:auto;max-width:100%}table{border-collapse:collapse;width:100%;min-width:660px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px}.state{border-left:4px solid var(--brand);padding:10px 12px;background:#f5f8ff;margin-top:10px}.state[data-work-state=empty]{border-color:var(--warn)}.state[data-work-state=permission_denied],.state[data-work-state=temporary_error]{border-color:var(--bad)}.actions{display:flex;gap:7px;flex-wrap:wrap}.totals{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.total{padding:8px 10px;background:#eef3fb;border-radius:8px;font-variant-numeric:tabular-nums}.mobile-only{display:none}@media(max-width:760px){.app{display:block}.side{padding:10px}.logo{margin:0 5px 8px}.nav{display:flex;overflow:auto}.nav a{white-space:nowrap}.main{padding:12px}.grid,.filters{grid-template-columns:1fr}.head{align-items:flex-start}.desktop-only{display:none}.mobile-only{display:block}}@media(max-width:360px){.main{padding:8px}.card{padding:11px}.actions>*{width:100%}table{min-width:600px}}.app{display:block}.main{max-width:620px;margin:auto;padding:12px}.side{display:none}.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.quick a{padding:12px;background:#edf2fd;border-radius:9px;text-decoration:none;font-weight:700}@media(max-width:360px){.quick{grid-template-columns:1fr}}</style><style id="linkmax-accessibility">
.skip-link{position:fixed;top:8px;left:8px;z-index:9999;padding:10px 14px;border-radius:8px;background:#111;color:#fff;text-decoration:none;transform:translateY(-160%)}
.skip-link:focus{transform:translateY(0)}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
:where(a,button,input,select,textarea,[tabindex]):focus-visible{outline:3px solid #ffbf00!important;outline-offset:3px!important}
:where(button,input,select,textarea,.cta,.ghost,.action,.tab a){min-block-size:24px;min-inline-size:24px}
main{min-width:0}
.card,.grid2>*{min-width:0}
.table-scroll{width:100%;max-width:100%;overflow-x:auto;overscroll-behavior-inline:contain}
.table-scroll table{min-width:max-content}
.col:focus .tipbox,.col:focus-visible .tipbox{display:block}
.tab button{appearance:none;background:none;border:0;color:var(--tx3);font:inherit;text-align:center;padding:0;cursor:not-allowed}
.tab button i{display:block;font-size:19px;font-style:normal}
@media (forced-colors:active){.skip-link{border:2px solid ButtonText}.nav a.on{outline:2px solid currentColor}}
</style><style id="linkmax-ui-state-style">
.page-state{max-width:1080px;margin:16px 20px;padding:22px;border:1px solid var(--bd,var(--border,#d8d8d8));border-radius:12px;background:var(--card,var(--surface-1,#fff));color:var(--tx,var(--text-primary,#111));box-shadow:0 8px 28px #0000000d}
.page-state h2{margin:0 0 5px;font-size:18px}.page-state p{margin:0;color:var(--tx2,var(--text-secondary,#555))}
.page-state button{margin-top:14px;padding:9px 14px;border:0;border-radius:7px;background:var(--s1,#2a78d6);color:#fff;font-weight:700;cursor:pointer}
.page-state[data-state="loading"]{border-left:5px solid var(--s1,#2a78d6)}
.page-state[data-state="empty"]{border-left:5px solid var(--warn,#fab219)}
.page-state[data-state="error"]{border-left:5px solid var(--crit,#d03b3b)}
body[data-ui-state="empty"] main>*:not(#page-state){display:none!important}
body[data-ui-state="loading"] main>*:not(#page-state),body[data-ui-state="error"] main>*:not(#page-state){opacity:.28;pointer-events:none;user-select:none}
@media(max-width:700px){.page-state{margin:12px;padding:17px}}
</style><style id="linkmax-language-style">
.lang-switch{position:fixed;right:14px;bottom:14px;z-index:9998;padding:8px 12px;border:1px solid var(--bd,#d0d0d0);border-radius:999px;background:var(--card,#fff);color:var(--tx,#111);font:700 12px/1.2 sans-serif;text-decoration:none;box-shadow:0 3px 14px #0002}
.lang-switch:focus-visible{outline:3px solid #ffbf00;outline-offset:3px}
</style><style id="stage1-ux-style">.stage1-panel{background:var(--card,#fff);border:1px solid var(--bd,var(--line,#d9e1ee));border-radius:12px;padding:16px;margin:14px 0}.stage1-panel h2{margin-top:0}.stage1-facts{display:flex;gap:7px;flex-wrap:wrap}.stage1-facts span{background:#edf4ff;color:#174b9c;padding:6px 8px;border-radius:8px;font-weight:700}.stage1-simple-nav details{padding:0;margin:0;background:transparent;border:0}.stage1-simple-nav summary{cursor:pointer;padding:9px 11px}.stage1-mobile-nav{position:sticky;bottom:0;background:var(--card,#fff);border-top:1px solid var(--bd,var(--line,#d9e1ee));display:grid;grid-template-columns:repeat(5,1fr);z-index:8}.stage1-mobile-nav a{text-align:center;padding:10px 3px;text-decoration:none;font-size:12px}@media(max-width:360px){.stage1-panel{padding:12px}}</style></head><body><a class="skip-link" href="#main-content">본문으로 건너뛰기</a><main class="main" id="main-content" tabindex="-1"><section id="page-state" hidden tabindex="-1" role="status" aria-live="polite" aria-atomic="true"></section><header class="head"><div><h1>모바일 핵심 업무</h1><p>링크 생성 결과와 운영 상태는 서버 응답으로만 표시합니다.</p></div></header><section class="card"><h2>상품 링크 만들기</h2><label class="field">프로퍼티 ID<input id="property-id" autocomplete="off" aria-label="입력 항목"></label><label class="field">https 상품 주소<input id="destination" type="url" inputmode="url" placeholder="https://..." aria-label="입력 항목"></label><div class="actions" style="margin-top:10px"><button type="button" id="create-link">검증하고 만들기</button><button type="button" id="load-links" class="secondary">내 링크 확인</button></div><div id="created-actions" hidden><b id="created-link"></b><div class="actions"><button type="button" id="copy-created" class="secondary">복사</button><button type="button" id="share-created">공유</button></div></div><div class="table-wrap"><div class="table-scroll" tabindex="0" role="region" aria-label="상품 링크 만들기 표"><table data-workspace-table><caption class="sr-only">상품 링크 만들기 표</caption><thead><tr><th>링크</th><th>목적지</th><th>캠페인</th><th>상태</th><th>작업</th></tr></thead><tbody id="workspace-rows"></tbody></table></div></div></section><section class="card"><h2>바로가기</h2><div class="quick"><a href="reports.html">수익 단계</a><a href="billing.html">구독 상태</a><a href="reconciliation.html">미대조 사건</a><a href="settings.html">지원·무료 권리</a></div></section><div id="work-state" class="state" data-work-state="empty" role="status" aria-live="polite">서버 자료를 아직 불러오지 않았습니다.</div><!-- stage2:mobile-entry:start --><section class="card" id="stage2-entry"><h2>고급 무료 작업대</h2><p>역할·검색·원인·공유·이어하기·오프라인 초안을 한곳에서 사용하세요.</p><a class="action" href="/m/advanced.html">고급 무료 작업대</a></section><!-- stage2:mobile-entry:end --><!-- fac:entry:start --><section class="card stage1-panel" id="free-advanced-entry"><h2>무료 고급 상용 작업대</h2><p>로그인 없이 안전한 링크와 수익화 설계를 완성하세요.</p><a class="action primary" href="/m/free-advanced.html">무료 고급 상용 작업대</a></section><!-- fac:entry:end --></main><script>(()=>{
const state=document.getElementById('work-state');
const labels={loading:'불러오는 중입니다.',empty:'조건에 맞는 운영 데이터가 없습니다.',partial_success:'일부 자료만 확인되었습니다.',permission_denied:'이 작업을 볼 권한이 없습니다.',temporary_error:'서버에 일시적으로 연결하지 못했습니다.',completed:'서버 자료를 확인했습니다.'};
function setState(name,detail=''){state.dataset.workState=name;const title=document.createElement('span');title.textContent=labels[name]||name;state.replaceChildren(title);if(detail){const more=document.createElement('span');more.textContent=' '+detail;state.append(more)}}
async function request(path,options){const base=globalThis.LINKMAX_API_ORIGIN;if(!base)throw Object.assign(new Error('API 연결이 설정되지 않았습니다.'),{kind:'temporary_error'});const response=await fetch(base+path,{credentials:'include',...options});if(response.status===401||response.status===403)throw Object.assign(new Error('권한 확인이 필요합니다.'),{kind:'permission_denied'});if(!response.ok)throw Object.assign(new Error('HTTP '+response.status),{kind:response.status>=500?'temporary_error':'permanent_error'});return response.json()}
function fail(error){setState(error.kind||'temporary_error',error.message||'다시 시도해 주세요.')}
function cell(row,value){const td=document.createElement('td');td.textContent=String(value??'—');row.append(td)}
const property=document.getElementById('property-id');
async function loadLinks(){setState('loading');const tbody=document.getElementById('workspace-rows');tbody.replaceChildren();try{const id=property.value.trim();if(!id)throw Object.assign(new Error('프로퍼티 ID를 입력하세요.'),{kind:'empty'});const result=await request('/v1/links?propertyId='+encodeURIComponent(id));for(const item of result.data){const tr=document.createElement('tr');cell(tr,item.shortUrl||item.id);cell(tr,item.destUrl);cell(tr,item.campaign);cell(tr,item.status);const td=document.createElement('td'),copy=document.createElement('button');copy.className='secondary';copy.textContent='복사';copy.addEventListener('click',async()=>{await navigator.clipboard.writeText(item.shortUrl);copy.textContent='복사됨'});td.append(copy);tr.append(td);tbody.append(tr)}setState(result.data.length?'completed':'empty')}catch(error){fail(error)}}
async function createLink(){setState('loading');try{const propertyId=property.value.trim(),url=document.getElementById('destination').value.trim();if(!propertyId||!/^https:\/\//.test(url))throw Object.assign(new Error('프로퍼티 ID와 https 주소를 확인하세요.'),{kind:'empty'});const result=await request('/v1/links',{method:'POST',headers:{'content-type':'application/json','idempotency-key':'workspace-'+Date.now()},body:JSON.stringify({propertyId,url})});document.getElementById('created-link').textContent=result.shortUrl;document.getElementById('created-actions').hidden=false;setState('completed','링크 생성 영수증을 받았습니다.');await loadLinks()}catch(error){fail(error)}}
async function loadTransactions(){setState('loading');const params=new URLSearchParams();for(const [id,key] of [['from','from'],['to','to'],['currency','currency'],['status-filter','status'],['search','search']]){const value=document.getElementById(id)?.value.trim();if(value)params.set(key,id==='from'?value+'T00:00:00.000Z':id==='to'?value+'T00:00:00.000Z':value)}const tbody=document.getElementById('workspace-rows');tbody.replaceChildren();try{const result=await request('/v1/conversions?'+params);for(const item of result.data){const tr=document.createElement('tr');cell(tr,item.occurredAt);cell(tr,item.network);cell(tr,item.orderRef);cell(tr,item.currency);cell(tr,item.commission);cell(tr,item.status);tbody.append(tr)}const totals=document.getElementById('totals');totals.replaceChildren(...Object.entries(result.totals||{}).map(([currency,amount])=>{const span=document.createElement('span');span.className='total';span.textContent=currency+' '+amount+' micro';return span}));const download=document.getElementById('download');if(result.downloadPath){download.href=globalThis.LINKMAX_API_ORIGIN+result.downloadPath;download.hidden=false;download.dataset.queryDigest=result.queryDigest}setState(result.data.length?'completed':'empty','조회지문 '+result.queryDigest)}catch(error){fail(error)}}
async function saveView(){try{const filters={timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'};for(const [id,key] of [['from','from'],['to','to'],['search','search'],['status-filter','status']]){const value=document.getElementById(id)?.value.trim();if(value)filters[key]=id==='from'?value+'T00:00:00.000Z':id==='to'?value+'T00:00:00.000Z':value}const currency=document.getElementById('currency')?.value.trim().toUpperCase();if(currency)filters.currencies=[currency];await request('/v1/saved-views',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:document.getElementById('view-name').value,viewType:'transactions',filters,sort:[{field:'occurredAt',direction:'desc'}]})});setState('completed','계정·사용자 범위로 저장했습니다.')}catch(error){fail(error)}}
async function loadLedger(){setState('loading');const tbody=document.getElementById('workspace-rows');tbody.replaceChildren();try{const result=await request('/v1/ledger/entries');const rows=result.data.filter(item=>String(item.type).includes('payout'));for(const item of rows){const tr=document.createElement('tr');cell(tr,item.createdAt);cell(tr,item.type);cell(tr,item.currency);cell(tr,item.amount??item.amountMicro);cell(tr,item.refId);tbody.append(tr)}setState(rows.length?'completed':'empty')}catch(error){fail(error)}}
document.getElementById('load-links')?.addEventListener('click',loadLinks);document.getElementById('create-link')?.addEventListener('click',createLink);document.getElementById('load-transactions')?.addEventListener('click',loadTransactions);document.getElementById('save-view')?.addEventListener('click',saveView);document.getElementById('load-ledger')?.addEventListener('click',loadLedger);
document.getElementById('copy-created')?.addEventListener('click',()=>navigator.clipboard.writeText(document.getElementById('created-link').textContent));document.getElementById('share-created')?.addEventListener('click',async()=>{const url=document.getElementById('created-link').textContent;if(navigator.share)await navigator.share({title:'LinkMax 링크',url});else await navigator.clipboard.writeText(url)});
globalThis.LinkMaxWorkspace={request,setState,fail,cell};
})();</script><script id="linkmax-accessibility-runtime">document.addEventListener('click',function(e){var b=e.target.closest('[data-theme-toggle]');if(!b)return;var dark=document.documentElement.dataset.theme==='dark';document.querySelectorAll('[data-theme-toggle]').forEach(function(x){x.setAttribute('aria-pressed',String(dark))})});</script><script id="linkmax-ui-state-runtime">(()=>{
  const params=new URLSearchParams(location.search);
  const mode=params.get('state');
  if(!['loading','empty','error'].includes(mode))return;
  const state=document.getElementById('page-state');
  const copy={
    loading:['데이터를 불러오는 중입니다…','잠시만 기다려 주세요. 최신 정보를 안전하게 확인하고 있습니다.'],
    empty:['표시할 데이터가 없습니다.','필터를 지우거나 기간을 넓혀보세요.'],
    error:['데이터를 불러오지 못했습니다.','잠시 후 다시 시도해 주세요.']
  }[mode];
  document.body.dataset.uiState=mode;
  document.body.setAttribute('aria-busy',String(mode==='loading'));
  state.hidden=false;state.dataset.state=mode;
  state.innerHTML='<h2>'+copy[0]+'</h2><p>'+copy[1]+'</p>'+(mode==='error'?'<button type="button">다시 시도</button>':'');
  state.focus();
  state.querySelector('button')?.addEventListener('click',()=>{params.delete('state');const query=params.toString();location.href=location.pathname+(query?'?'+query:'')+location.hash});
})();</script><a class="lang-switch" href="/en/m/index.html" aria-label="Switch to English">English</a><!-- stage1:mobile-nav:start --><nav class="stage1-mobile-nav" aria-label="모바일 핵심 메뉴"><a href="index.html" aria-current="page">홈</a><a href="index.html#create">링크</a><a href="reports.html">수익</a><a href="alerts.html">알림</a><a href="settings.html">더보기</a></nav><!-- stage1:mobile-nav:end --></body></html>
